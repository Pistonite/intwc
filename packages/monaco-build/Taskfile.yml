version: '3'

includes:
  ecma:
    taskfile: ./node_modules/mono-dev/task/ecma.yaml
    internal: true
    optional: true

tasks:
  make:
    desc: Build the full package and copy it to ../intwc
    cmds:
      - task: install
      - task: ecma:config
      - task: patch-typescript
      - task: patch-toml
      - task: build-src
      - task: copy-metafiles
      - pnpm exec mono publish --dry-run # this also includes build
      # check the ./styles exports, since we don't control that name directly
      # (should be the same as the package name)
      - cmd: |
          styles=$(jq -r '.exports["./styles"]' node_modules/.mono/pnpm-pack.temp/package/package.json);
          test -f "node_modules/.mono/pnpm-pack.temp/package/$styles" || { echo "./styles entry point not found, please check the output asset name"; exit 1; };
        silent: true
      - task: build-dts
      - task: copy-package

  install:
    desc: Install and copy original monaco-editor package
    cmds:
      - pnpm i
      - rm -rf monaco-editor lib
      - cp -R -L node_modules/monaco-editor .
      - mv monaco-editor lib
      - rm -rf lib/node_modules lib/min lib/dev
      - rm -f
          lib/package.json
          lib/esm/vs/editor/editor.all.js
          lib/monaco.d.ts
          lib/esm/vs/editor/internal/initialize.d.ts

  copy-metafiles:
    - cp lib/LICENSE ../intwc/LICENSE-monaco
    - cp lib/README.md ../intwc/README-monaco
    - cp lib/ThirdPartyNotices.txt ../intwc/ThirdPartyNotices-monaco.txt

  patch-typescript:
    - node --experimental-strip-types scripts/patch-tsworker.ts
    - cat lib/esm/vs/basic-languages/typescript/typescript.js | sed 's/const language =/const languageOriginal =/' | sed 's/export {.*;//' > lib/esm/vs/basic-languages/typescript/typescript2.js
    - cat patches/typescript/typescript.js >> lib/esm/vs/basic-languages/typescript/typescript2.js
    - mv lib/esm/vs/basic-languages/typescript/typescript2.js lib/esm/vs/basic-languages/typescript/typescript.js

  patch-toml:
    - mkdir -p lib/esm/vs/basic-languages/toml
    - rg '^import' lib/esm/vs/basic-languages/yaml/yaml.js --no-line-number > lib/esm/vs/basic-languages/toml/toml.js
    - cat patches/toml/toml.js >> lib/esm/vs/basic-languages/toml/toml.js
    - rg '^export' lib/esm/vs/basic-languages/yaml/yaml.js --no-line-number >> lib/esm/vs/basic-languages/toml/toml.js
    - cp patches/toml/toml.contribution.js lib/esm/vs/basic-languages/toml

  build-src:
    - node --experimental-strip-types scripts/gen-languages.ts
    - node --experimental-strip-types scripts/gen-translations.ts

  build-dts:
    vars:
      DTS_DIR: node_modules/.mono/pnpm-pack.temp/package/dist/_dts_
    cmds:
      - rm {{.DTS_DIR}}/src/**/*.d.ts.map
      - for file in {{.DTS_DIR}}/src/**/*.d.ts; do echo 'export {}' > $file; done
      # - for file in {{.DTS_DIR}}/src/language/*.d.ts; do echo 'export {}' > $file; done
      # - for file in {{.DTS_DIR}}/src/language-ex/*.d.ts; do echo 'export {}' > $file; done
      # - for file in {{.DTS_DIR}}/src/translation/*.d.ts; do echo 'export {}' > $file; done
      # - for file in {{.DTS_DIR}}/src/worker/*.d.ts; do echo 'export {}' > $file; done
      - rm {{.DTS_DIR}}/src/editor_api.d.ts {{.DTS_DIR}}/src/editor_api.d.ts.map
      - cp lib/esm/vs/editor/editor.main.d.ts {{.DTS_DIR}}/src/editor_api.d.ts
      - cp lib/esm/vs/editor/editor.api.d.ts {{.DTS_DIR}}/src

  copy-package:
    - rm -rf ../intwc/src/monaco
    - cp -R node_modules/.mono/pnpm-pack.temp/package ../intwc/src/monaco
